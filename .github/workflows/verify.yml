name: verify

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify RouteCraft contracts
        run: python scripts/verify.py

      - name: Test persistent decision memory and fleet bootstrap
        run: python -m unittest discover -s tests -v

      - name: Check shell syntax
        if: runner.os == 'Linux'
        run: |
          sh -n plugins/codex-routecraft/scripts/install-agents.sh
          sh -n plugins/codex-routecraft/scripts/routecraft-memory.sh
          sh -n scripts/setup-local.sh
          sh -n scripts/bootstrap-device.sh

      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content plugins/codex-routecraft/scripts/install-agents.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content plugins/codex-routecraft/scripts/routecraft-memory.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content scripts/setup-local.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content scripts/bootstrap-device.ps1 -Raw)) | Out-Null

      - name: Check whitespace
        if: runner.os == 'Linux'
        run: git diff --check
