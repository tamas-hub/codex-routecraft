name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify RouteCraft contracts
        run: python scripts/verify.py

      - name: Check shell syntax
        run: |
          sh -n plugins/codex-routecraft/scripts/install-agents.sh
          sh -n scripts/setup-local.sh

      - name: Check whitespace
        run: git diff --check
